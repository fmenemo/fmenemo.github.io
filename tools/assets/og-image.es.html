<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- La maqueta y la paleta están en la hoja de estilos de al lado, para que
         un cambio de estilo no pueda alcanzar la tarjeta de una edición y
         olvidarse de la otra. Aquí queda el texto, condensado de `identity.line`
         en `src/content.es.ts`, que a su vez viene del CV en español: la tarjeta
         no es una traducción de la inglesa, igual que la edición no es una
         traducción de la inglesa (ADR 0004). Si cambia la línea de identidad,
         cambia aquí y se vuelve a renderizar según el README de al lado. -->
    <link rel="stylesheet" href="og-image.css" />
  </head>
  <body>
    <div class="sheet">
      <!-- El dominio con su /es: es la propia tarjeta diciendo qué edición se
           está compartiendo, en el lugar donde la página lleva su encabezado
           corriente. -->
      <p class="hand running-head">fmenemo.github.io/es</p>
      <h1>Fran<br />Menéndez</h1>
      <p class="identity">
        Ingeniero full-stack, más de 10 años entregando productos completos de principio a fin en
        TypeScript, ahora en la capa de IA.
      </p>
      <!-- El colofón: el lugar a la izquierda y la modalidad a la derecha,
           como los dos campos que lo sitúan al principio del registro. -->
      <p class="hand meta">
        <span>Zaragoza, España</span>
        <span>Remoto</span>
      </p>
    </div>
  </body>
</html>
