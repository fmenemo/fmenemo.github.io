<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The layout and the palette are in the stylesheet beside this file, so
         that a restyle cannot reach one edition's card and miss the other. What
         is left here is the copy, condensed from `identity.line` in
         `src/content.en.ts`: like everything else a visitor reads, it answers to
         the CV (ADR 0001). Change the identity line, change it here, re-render
         per the README. -->
    <link rel="stylesheet" href="og-image.css" />
  </head>
  <body>
    <div class="sheet">
      <!-- The running head, saying which edition is being shared, the way the
           page's own running head says whose record this is. -->
      <p class="hand running-head">fmenemo.github.io</p>
      <h1>Fran<br />Menéndez</h1>
      <p class="identity">
        Full-stack engineer. 10+ years shipping whole products end to end in TypeScript, now working
        at the AI layer.
      </p>
      <!-- The colophon row: the place on the left and the mode on the right,
           as the two fields that place him do at the top of the record. -->
      <p class="hand meta">
        <span>Zaragoza, Spain</span>
        <span>Remote</span>
      </p>
    </div>
  </body>
</html>
