<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GitHub Pages serves this file for any path it does not recognise, from
         the site root and with no build behind it: Vite copies `public/`
         verbatim, so what is written here is the whole of what a visitor gets.
         That is why the stylesheet is inline and the faces are files of this
         page's own — a hashed bundle asset is not a name a static file can
         spell, and a 404 that depended on a build would be the one page that
         breaks when the build does.

         It belongs to neither edition. Whoever lands here mistyped a URL and
         has said nothing about which language they want, so the page is
         English — the same asymmetry `x-default` already carries in both entry
         documents — and it offers both editions rather than guessing. -->
    <title>Page not found | Fran Menéndez</title>

    <!-- A 404 is not a page a search engine should hold on to. -->
    <meta name="robots" content="noindex" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The browser chrome takes the surface colour of each theme, so the -->
    <!-- address bar continues the page rather than interrupting it. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />

    <script>
      // Set the theme class before first paint so a dark-mode visitor never
      // sees a light flash. Mirrors resolveTheme/applyTheme in src/theme.ts.
      //
      // Copied from the entry documents for the reason they already record
      // between themselves: it has to run before anything else loads, and here
      // there is no module to import it from at all. The key is the same and
      // localStorage is per-origin, so a theme chosen on either edition is
      // already in effect on this page.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          /* no localStorage: leave the light default */
        }
      })();
    </script>

    <style>
      /* The three faces this page wears, from copies in `public/fonts/`: sans
         400 for the running line, 600 for the heading, mono 400 for the
         metadata voice. The same latin subsets `src/index.css` imports from
         @fontsource, kept here because this page cannot reach the bundle. */
      @font-face {
        font-family: 'Geist Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/geist-sans-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Sans';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/geist-sans-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/geist-mono-latin-400-normal.woff2') format('woff2');
      }

      /* The palette, in the values `src/index.css` sets them to. Change one,
         change the other: a 404 in the wrong red is a page from another site. */
      :root {
        --paper: #ffffff;
        --ink: #111111;
        --muted: #5f5f5f;
        --rule: #d9d9d9;
        --accent: #cc2200;
      }

      html.dark {
        --paper: #0d0d0d;
        --ink: #ededed;
        --muted: #9a9a9a;
        --rule: #2b2b2b;
        --accent: #ff5540;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Geist Sans', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* The measure, as `Container` defines it: 64rem with the page's gutters,
         so the left edge sits where it does everywhere else on the site. */
      main {
        width: 100%;
        max-width: 64rem;
        margin: 0 auto;
        padding: 6rem 1.5rem;
      }

      .eyebrow {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0;
      }

      h1 {
        font-size: clamp(3rem, 10vw, 4.5rem);
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: -0.02em;
        margin: 2rem 0 0;
      }

      p {
        max-width: 42rem;
        margin: 2rem 0 0;
        font-size: 1.125rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .editions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 2rem;
        margin-top: 3rem;
        padding: 0;
        list-style: none;
      }

      /* Both links wear the same treatment. Neither edition is the lesser one
         (ADR 0004), and a reader who arrived here has given no reason to put
         one of them second. */
      .editions a {
        display: inline-block;
        border: 2px solid var(--ink);
        padding: 0.75rem 1.5rem;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: inherit;
        text-decoration: none;
        transition: background-color 150ms, color 150ms;
      }

      .editions a:hover {
        background: var(--ink);
        color: var(--paper);
      }

      /* The same focus ring the site draws on every interactive element. */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>This page does not exist</h1>
      <p>The address you followed matches nothing here. Both editions of the site start below.</p>
      <ul class="editions">
        <li><a href="/">English</a></li>
        <!-- `lang` as well as `hreflang`, unlike the language selector in the
             masthead: this link's own text is Spanish, so it is what the
             element is written in and not only what sits at the other end. -->
        <li><a href="/es/" hreflang="es" lang="es">Español</a></li>
      </ul>
    </main>
  </body>
</html>
