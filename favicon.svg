<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The letter is drawn as geometry rather than set as type: a favicon
       cannot carry a font with it, so text would render in whatever monospace
       the visitor's machine happens to have. Approved as option B.

       The two colours are --color-ink and --color-paper from src/index.css.
       A standalone SVG cannot read those tokens, so they are copied here; a
       restyle has to follow the stylesheet rather than this file. -->
  <rect width="32" height="32" fill="#111111" />
  <g fill="#ffffff">
    <rect x="9" y="6" width="5" height="20" />
    <rect x="9" y="6" width="15" height="5" />
    <rect x="9" y="13.5" width="11" height="5" />
  </g>
</svg>
