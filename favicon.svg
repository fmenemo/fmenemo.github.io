<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The letter is drawn as geometry rather than set as type: a favicon
       cannot carry a font with it, so text would render in whatever monospace
       the visitor's machine happens to have. Approved as option B.

       The two colours are the ink and paper tokens from src/index.css. A
       standalone SVG cannot read those tokens, so they are copied here; a
       restyle has to follow the stylesheet rather than this file.

       Their token names are spelled without their leading dashes on purpose:
       a double hyphen cannot appear inside an XML comment, and an SVG that
       does not parse is not a lenient favicon, it is no favicon. -->
  <rect width="32" height="32" fill="#111111" />
  <g fill="#ffffff">
    <rect x="9" y="6" width="5" height="20" />
    <rect x="9" y="6" width="15" height="5" />
    <rect x="9" y="13.5" width="11" height="5" />
  </g>
</svg>
