<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Every tag below is static markup on purpose. Slack, LinkedIn and
         WhatsApp fetch this document and stop without running React, so a tag
         written by a component exists too late to be read. -->
    <title>Fran Menéndez | Software Engineer</title>
    <meta
      name="description"
      content="Software Engineer, 10+ years building platforms that serve millions of users, now working at the AI layer: semantic search, MCP tooling, agentic workflows."
    />
    <meta name="author" content="Fran Menéndez" />
    <link rel="canonical" href="https://fmenemo.github.io/" />

    <!-- Both documents carry the same alternate set, each including itself, so
         a crawler that finds either one finds the pair. `x-default` points at
         the English edition: it is the one place English legitimately leads,
         and it is invisible to humans (ADR 0004). -->
    <link rel="alternate" hreflang="en" href="https://fmenemo.github.io/" />
    <link rel="alternate" hreflang="es" href="https://fmenemo.github.io/es/" />
    <link rel="alternate" hreflang="x-default" href="https://fmenemo.github.io/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The browser chrome takes the surface colour of each theme, so the -->
    <!-- address bar continues the page rather than interrupting it. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fran Menéndez" />
    <meta property="og:title" content="Fran Menéndez | Software Engineer" />
    <meta
      property="og:description"
      content="Software Engineer, 10+ years building platforms that serve millions of users, now working at the AI layer: semantic search, MCP tooling, agentic workflows."
    />
    <meta property="og:url" content="https://fmenemo.github.io/" />
    <!-- A scraper resolves this against nothing, so it has to be absolute. -->
    <meta property="og:image" content="https://fmenemo.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fran Menéndez, Software Engineer, Zaragoza, Spain." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fran Menéndez | Software Engineer" />
    <meta
      name="twitter:description"
      content="Software Engineer, 10+ years building platforms that serve millions of users, now working at the AI layer: semantic search, MCP tooling, agentic workflows."
    />
    <meta name="twitter:image" content="https://fmenemo.github.io/og-image.png" />
    <script>
      // Set the theme class before first paint so a dark-mode visitor never
      // sees a light flash. Mirrors resolveTheme/applyTheme in src/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          /* no localStorage: leave the light default */
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/en-nDJ1h4X3.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/App-Z1eyejXN.js">
    <link rel="stylesheet" crossorigin href="/assets/App-DjN99fmy.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
